locale:
  language: german

design:
  theme: moderncv
  page:
    size: a4
    top_margin: 1.3cm
    bottom_margin: 1.3cm
    left_margin: 1.5cm
    right_margin: 1.5cm
  colors:
    name: rgb(0, 0, 0)
    headline: rgb(0, 0, 0)
    connections: rgb(0, 0, 0)
    section_titles: rgb(0, 0, 0)
    links: rgb(0, 0, 0)
  typography:
    font_family: Source Sans 3
    font_size:
      body: 10.5pt
      name: 24pt
      headline: 10pt
      connections: 9pt
      section_titles: 14pt
    line_spacing: 0.5em
    alignment: left
  header:
    alignment: left
    photo_width: 3cm
    photo_position: right
    photo_space_left: 0cm
    photo_space_right: 0.3cm
    space_below_name: 0.3cm
    space_below_connections: 0.4cm
  section_titles:
    type: moderncv
    space_above: 0.45cm
    space_below: 0.2cm

settings:
  current_date: today
  render_command:
    output_folder: rendercv_partime
    typst_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV.typ
    pdf_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV.pdf
    markdown_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV.md
    html_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV.html
    png_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV.png
    dont_generate_markdown: true
    dont_generate_html: true
    dont_generate_typst: false
    dont_generate_pdf: false
    dont_generate_png: true
  bold_keywords: []
  pdf_title: Danium Syed Lebenslauf